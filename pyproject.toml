[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-pulse"
version = "0.1.0"
description = "Turn any git repository into a beautiful, self-contained HTML report — zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arman", email = "gamingvac082@gmail.com" }]
keywords = ["git", "analytics", "report", "visualization", "cli", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Giochvanno/repo-pulse"
Issues = "https://github.com/Giochvanno/repo-pulse/issues"

[project.scripts]
repo-pulse = "repo_pulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_pulse"]

[tool.hatch.build]
include = ["src/repo_pulse/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
