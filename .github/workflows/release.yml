name: Release to PyPI

# Publishing is done with PyPI Trusted Publishing — no API token in secrets.
# One-time setup: create the project on PyPI, then add a trusted publisher with
# owner = your GitHub user, repo = repo-pulse, workflow = release.yml,
# environment = pypi. After that, `git tag v0.1.0 && git push --tags` releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/repo-pulse/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
